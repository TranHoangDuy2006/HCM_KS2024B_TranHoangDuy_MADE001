<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <title>HCM KS2024B Tran Hoang Duy MADESO 001</title>
</head>
<body>

    <!-- Header -->
    <header>
        <h1>Quản Lí Sinh Viên</h1>
    </header>

    <!-- Main -->
    <main>
        <div class="main-content">
            <input type="text" id="nameInput" placeholder="Họ và tên">
            <p id="nameStatus"></p>
            <input type="text" id="idInput" placeholder="Mã số sinh viên">
            <p id="idStatus"></p>
            <input type="text" id="emailInput" placeholder="Email">
            <p id="emailStatus"></p>
            <input type="text" id="classInput" placeholder="Lớp">
            <p id="classStatus"></p>
            <button id="addStudent" type="button">Thêm sinh viên</button>
        </div>
        <div class="findField">
            <input type="text" id="searchInput" placeholder="Tìm kiếm theo tên...">
            <table class="table-hover" border="1" id="findStudent">
                <thead>
                    <tr>
                        <th>Họ tên</th>
                        <th>MSSV</th>
                        <th>Email</th>
                        <th>Lớp</th>
                        <th>Hành động</th>
                    </tr>               
                </thead>
                <tbody id="findStudentBody">
                
                </tbody>
            </table>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="main.js"></script>

</body>
</html>
